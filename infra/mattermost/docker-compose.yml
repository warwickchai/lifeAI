# Mattermost TEAM EDITION (MIT, no message cap). Do NOT switch to the
# "mattermost-enterprise-edition" image: unlicensed it runs as "Entry"
# with a 10,000-message history cap.
name: lifeai-mattermost

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mattermost
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      retries: 10

  mattermost:
    image: mattermost/mattermost-team-edition:${MM_VERSION:-10.5}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Bound to localhost only. Exposed to your devices via `tailscale serve`.
    ports:
      - "127.0.0.1:8065:8065"
    environment:
      TZ: ${TZ:-Australia/Sydney}
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${POSTGRES_PASSWORD}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${MM_SITEURL:?set MM_SITEURL in .env}
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
      MM_TEAMSETTINGS_ENABLEUSERCREATION: "false"
      # Push: Team Edition uses Mattermost's free test push server (no SLA).
      # "full" = message text in notifications. Push only fires for DMs and
      # @mentions by default, i.e. alerts DM'd by private-bot.
      MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS: "true"
      MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER: https://push-test.mattermost.com
      MM_EMAILSETTINGS_PUSHNOTIFICATIONCONTENTS: full
    volumes:
      - mm_config:/mattermost/config
      - mm_data:/mattermost/data
      - mm_logs:/mattermost/logs
      - mm_plugins:/mattermost/plugins
      - mm_client_plugins:/mattermost/client/plugins
      - mm_bleve:/mattermost/bleve-indexes

volumes:
  pgdata:
  mm_config:
  mm_data:
  mm_logs:
  mm_plugins:
  mm_client_plugins:
  mm_bleve:
